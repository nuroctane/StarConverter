[package]
name = "starconverter-cli"
description = "Image inspection, preview, and copy-based conversion frontend for StarConverter"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "starconverter"
path = "src/main.rs"

[dependencies]
starconverter-core = { path = "../starconverter-core" }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[lints]
workspace = true
