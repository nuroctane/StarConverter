name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-images:
    name: Independent unmounted image checks
    runs-on: ubuntu-24.04
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install independent readers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends exfatprogs ntfs-3g
          dpkg-query -W exfatprogs ntfs-3g
      - name: Test evidence harness
        run: |
          python3 -m unittest discover -s scripts -p test_external_images.py
          python3 -m unittest discover -s scripts -p test_ntfs_payloads.py
          python3 -m unittest discover -s scripts -p test_large_directory.py
          python3 -m unittest discover -s scripts -p test_formatter_ads.py
      - name: Generate regular image corpus
        id: generate
        run: cargo test -p starconverter-core --test export_external_fixtures -- --ignored --nocapture
      - name: Check images without mounting
        run: python3 scripts/validate-external-images.py target/external-validator-fixtures --report target/external-unmounted-report.json
      - name: Check NTFS logical bytes without mounting
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: python3 scripts/validate-ntfs-payloads.py target/external-validator-fixtures --report target/ntfs-payload-report.json
      - name: Traverse large NTFS directory without mounting
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: python3 scripts/validate-large-directory.py target/external-large-directory-fixtures --report target/large-directory-report.json
      - name: Build CLI for the formatter-origin probe
        id: cli
        if: ${{ !cancelled() }}
        run: cargo build -p starconverter-cli
      - name: Round-trip a formatter-origin NTFS image with ADS and inline security descriptors
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: python3 scripts/validate-formatter-ads.py target --cli target/debug/starconverter --report target/formatter-ads-report.json
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-unmounted-evidence
          path: |
            target/external-unmounted-report.json
            target/ntfs-payload-report.json
            target/large-directory-report.json
            target/formatter-ads-report.json
          if-no-files-found: warn

  windows-vhd:
    name: Windows filesystem-driver VHD gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the pinned Windows VHD candidates
        run: cargo test -p starconverter-core --test export_external_fixtures export_structural_candidate_images -- --ignored --nocapture
      - name: Build CLI for report verification
        run: cargo build -p starconverter-cli
      - name: Detached identity preflight
        shell: powershell
        run: .\scripts\validate-windows-vhd.ps1 -PreflightOnly -ReportPath target\windows-vhd-preflight-report.json
      - name: Attach read-only without a drive letter, CHKDSK, detach, re-hash
        id: driver
        shell: powershell
        run: .\scripts\validate-windows-vhd.ps1 -ReportPath target\windows-vhd-report.json
      - name: Verify the driver report with the CLI
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        shell: powershell
        run: .\target\debug\starconverter.exe verify-windows-report target\windows-vhd-report.json
      - name: Diagnostic mount probe (never gates)
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\scripts\probe-windows-vhd-mount.ps1
      - name: Upload Windows driver evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-vhd-evidence
          path: |
            target/windows-vhd-preflight-report.json
            target/windows-vhd-report.json
            target/windows-control/*.vhd
          if-no-files-found: warn

  windows-origin:
    name: Windows-formatted source gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p starconverter-cli
      - name: Format and populate with Windows, convert both ways, judge with the drivers
        id: origin
        shell: powershell
        run: .\scripts\validate-windows-origin.ps1 -ReportPath target\windows-origin-report.json
      - name: Verify the Windows-origin report with the CLI
        if: ${{ !cancelled() && steps.origin.outcome == 'success' }}
        shell: powershell
        run: .\target\debug\starconverter.exe verify-windows-origin-report target\windows-origin-report.json
      - name: Upload Windows-origin evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-origin-evidence
          path: |
            target/windows-origin-report.json
            target/windows-origin/*.vhd
            target/windows-origin/*.img
            target/windows-origin/*.starconverter-escrow
          if-no-files-found: warn

  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  rust-msrv:
    name: Rust / core+CLI MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy -p starconverter-core -p starconverter-cli --all-targets -- -D warnings
      - name: Test
        run: cargo +1.85.0 test -p starconverter-core -p starconverter-cli

  go-lab:
    name: Go lab / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: lab/go.mod
      - name: Format
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Print baseline matrix
        run: go run ./cmd/starconverter-lab matrix
