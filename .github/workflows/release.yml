name: Portable release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Bundle / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            extension: .exe
          - os: ubuntu-latest
            label: linux-x86_64
            extension: ''
          - os: macos-latest
            label: macos-native
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Build portable binaries
        run: cargo build --release -p starconverter-cli -p starconverter-gui
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "starconverter-${{ github.ref_name }}-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/release/starconverter${{ matrix.extension }}" "dist/$name/"
          Copy-Item "target/release/starconverter-gui${{ matrix.extension }}" "dist/$name/"
          Copy-Item README.md,LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -NoNewline -Encoding ascii "dist/$name.zip.sha256"
      - name: Package Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="starconverter-${{ github.ref_name }}-${{ matrix.label }}"
          mkdir -p "dist/$name"
          cp "target/release/starconverter${{ matrix.extension }}" "dist/$name/"
          cp "target/release/starconverter-gui${{ matrix.extension }}" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: starconverter-${{ github.ref_name }}-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: starconverter-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/*
