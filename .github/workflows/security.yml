name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'fuzz/Cargo.lock'
      - 'fuzz/Cargo.toml'
      - 'lab/go.mod'
      - 'lab/go.sum'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'fuzz/Cargo.lock'
      - 'fuzz/Cargo.toml'
      - 'lab/go.mod'
      - 'lab/go.sum'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec / workspace and fuzz locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit workspace lockfile
        run: cargo audit --deny yanked
      - name: Audit fuzz lockfile
        run: cargo audit --file fuzz/Cargo.lock --deny yanked --no-fetch

  govulncheck:
    name: Go vulnerability reachability / lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache-dependency-path: lab/go.mod
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan reachable Go code
        run: govulncheck ./...
